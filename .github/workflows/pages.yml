# Builds the pilot quiz app and publishes it with GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Then run this workflow from the Actions tab (it only runs when started by hand,
# so nothing goes live by accident).
name: Publish quiz app
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_items.py
      - run: python3 scripts/build_app.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
